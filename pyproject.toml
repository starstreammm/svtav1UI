[project]
name = "svtav1ui"
version = "4.0.3"
description = "A WebUI for SVT-AV1 through FFmpeg."
readme = "README.md"
authors = [
    { name = "StarStreammm", email = "xxh_private@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "natsort>=8.4.0",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "pypinyin>=0.55.0",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
svtav1ui = "svtav1ui:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
